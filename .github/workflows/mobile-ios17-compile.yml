# Fork: Compile against the 17.0 deployment target, verify target settings and libc++ imports, and optionally launch the simulator build.
# Fork-only: proves the mobile app still compiles at its iOS 17.0 deployment target.
# Enable with the repository variable T3CODE_IOS17_CHECK=true. See docs/operations/fork-releases.md.
name: Mobile iOS 17 compile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/client-runtime/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-ios17-compile.yml"
      - ".github/scripts/check-ios17-libcxx-imports.sh"
      - ".github/scripts/ios17-libcxx-exports.txt"
      - "patches/react-native-nitro-modules@*.patch"
  workflow_dispatch:
    inputs:
      simulator:
        description: Also launch a Release build on an iOS 17 simulator (downloads the runtime)
        type: boolean
        default: false

concurrency:
  group: mobile-ios17-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: vars.T3CODE_IOS17_CHECK == 'true'
    runs-on: ${{ vars.T3CODE_MACOS_RUNNER || 'macos-26' }}
    # React Native builds from source: about 40 min in CI, about 100 with the simulator launch.
    timeout-minutes: 150
    env:
      APP_VARIANT: development
      MOBILE_VERSION_POLICY: appVersion
      T3CODE_IOS_PERSONAL_TEAM: "0"
      EXPO_NO_GIT_STATUS: "1"
      CI: "1"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Generate the iOS project
        run: |
          vp exec expo prebuild --clean --platform ios --no-install
          (cd ios && pod install)

      - name: Assert every target is at most iOS 17.0
        run: |
          set -o pipefail
          targets=$(grep -ho 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*' ios/*.xcodeproj/project.pbxproj | sort -u)
          echo "$targets"
          grep -q '= 17.0$' <<<"$targets" || { echo "::error::the app target is not iOS 17.0"; exit 1; }
          awk '{ if ($3 + 0 > 17.0) bad = 1 } END { exit bad }' <<<"$targets" \
            || { echo "::error::an iOS target is above 17.0"; exit 1; }

      # The simulator SDK compiles every pod and Swift module against the 17.0 target,
      # so an unguarded iOS 18+ API fails here without needing an iOS 17 runtime.
      - name: Compile for the iOS Simulator SDK
        run: |
          set -o pipefail
          xcodebuild -workspace ios/T3CodeDev.xcworkspace -scheme T3CodeDev -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build | tail -200

      # Compiling at 17.0 still lets Swift's C++ interop link libc++ symbols that only iOS 18+
      # exports, and dyld kills the app at launch. Compare every libc++ import with iOS 17.0's.
      - name: Check libc++ imports against iOS 17.0
        run: ../../.github/scripts/check-ios17-libcxx-imports.sh build/Build/Products/Debug-iphonesimulator/T3CodeDev.app

      # Release embeds the JS bundle; the Debug dev client would only wait for Metro.
      # Proves the app starts on iOS 17, not that every screen works.
      - name: Launch a Release build on an iOS 17 simulator
        if: inputs.simulator
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild -workspace ios/T3CodeDev.xcworkspace -scheme T3CodeDev -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build | tail -50
          ../../.github/scripts/check-ios17-libcxx-imports.sh build/Build/Products/Release-iphonesimulator/T3CodeDev.app
          xcodebuild -downloadPlatform iOS -buildVersion 17.5
          runtime=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.version | startswith("17.")) | .identifier' | tail -1)
          [ -n "$runtime" ] || { echo "::error::this Xcode offers no iOS 17 simulator runtime"; exit 1; }
          # Xcode lists device types the iOS 17 runtime can't run; take one the runtime supports.
          device=$(xcrun simctl list runtimes -j | jq -r --arg r "$runtime" \
            '.runtimes[] | select(.identifier == $r) | .supportedDeviceTypes[] | select(.productFamily == "iPhone") | .identifier' | tail -1)
          [ -n "$device" ] || { echo "::error::the iOS 17 runtime supports no iPhone device type"; exit 1; }
          udid=$(xcrun simctl create ios17 "$device" "$runtime")
          xcrun simctl boot "$udid"
          app=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl install "$udid" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$udid" "$bundle"
          sleep 30
          # A crashed app can leave its label loaded with "-" as the PID, so require a live PID.
          services=$(xcrun simctl spawn "$udid" launchctl list)
          awk -v label="UIKitApplication:$bundle" 'index($3, label) == 1 && $1 ~ /^[0-9]+$/ { alive = 1 } END { exit !alive }' <<<"$services" \
            || { echo "::error::the app exited within 30 seconds"; exit 1; }
