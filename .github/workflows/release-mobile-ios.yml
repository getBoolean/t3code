# Fork: Keep unsigned Personal Team IPA packaging, fork OTA isolation, iOS 17 checks, concurrency, hosted compilation/dependency caches, and native app reuse keyed by the Expo fingerprint.
# Fork-only: builds the mobile app as an unsigned iOS IPA for sideloading. Users re-sign it with
# their own Apple ID (AltStore, SideStore, Sideloadly), so it is the Personal Team build: no push,
# widget or share extension, or native Sign in with Apple. release.yml calls this when the fork
# sets T3CODE_MOBILE_RELEASE=true; a pull request that edits this file builds it as a check.
# See docs/operations/fork-releases.md.
name: Release iOS (unsigned)

on:
  workflow_call:
    inputs:
      version:
        description: Release version, such as 0.1.7-nightly.20261103.1
        type: string
        required: true
      ref:
        type: string
        required: true
      clerk_publishable_key:
        type: string
        required: false
        default: ""
      clerk_jwt_template:
        type: string
        required: false
        default: ""
      relay_url:
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/release-mobile-ios.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Version for the file name and app (numeric part only reaches the app)
        type: string
        default: 0.0.0-check

env:
  RELEASE_VERSION: ${{ inputs.version || '0.0.0-check' }}
  APP_VARIANT: production
  T3CODE_IOS_PERSONAL_TEAM: "1"
  T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: ${{ vars.T3CODE_IOS_SIDELOAD_BUNDLE_ID || format('io.github.{0}.t3code', github.repository_owner) }}
  # Upstream's Expo update channel must never replace the fork's JavaScript.
  T3CODE_MOBILE_UPDATES_ENABLED: "0"
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk_publishable_key || vars.CLERK_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_CLERK_JWT_TEMPLATE: ${{ inputs.clerk_jwt_template || vars.CLERK_JWT_TEMPLATE }}
  T3CODE_RELAY_URL: ${{ inputs.relay_url || (vars.RELAY_DOMAIN && format('https://{0}', vars.RELAY_DOMAIN)) || '' }}
  EXPO_NO_GIT_STATUS: "1"
  CI: "1"
  COCOAPODS_DISABLE_STATS: "1"
  # The saved native app. Restore and save must name the same path for the cache to match.
  NATIVE_APP_PATH: apps/mobile/build/Build/Products/Release-iphoneos/*.app

defaults:
  run:
    working-directory: apps/mobile

# Most releases change only JavaScript. Expo's native fingerprint (the runtime version
# expo-updates embeds) keys the last native build: `native` runs xcodebuild on macOS only when no
# app is saved for it, and `ipa` always refreshes that app's JavaScript and packages it on Linux.
jobs:
  fingerprint:
    name: iOS native fingerprint
    # A PR check only runs while macOS CI is on (T3CODE_MACOS_CI); releases always build.
    if: vars.T3CODE_MOBILE_RELEASE == 'true' && (github.event_name != 'pull_request' || vars.T3CODE_MACOS_CI != 'false')
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      key: ${{ steps.native.outputs.key }}
      saved: ${{ steps.lookup.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...

      # iOS accepts only up to three dot-separated integers, so drop any prerelease suffix.
      - name: Resolve the app version
        id: version
        run: |
          app_version="${RELEASE_VERSION%%-*}"
          [[ "$app_version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] \
            || { echo "::error::cannot derive an iOS version from $RELEASE_VERSION"; exit 1; }
          echo "T3CODE_MOBILE_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      # The key also names this workflow, whose build settings shape the binary.
      - name: Compute the native fingerprint
        id: native
        run: |
          hash=$(node -e "require('expo/fingerprint').createFingerprintAsync(process.cwd(), { platforms: ['ios'], silent: true }).then(f => console.log(f.hash))")
          [ -n "$hash" ] || { echo "::error::Expo returned no native fingerprint"; exit 1; }
          echo "native fingerprint: $hash"
          echo "key=ios-native-app-v2-$hash-${{ hashFiles('.github/workflows/release-mobile-ios.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Look up the native app
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NATIVE_APP_PATH }}
          key: ${{ steps.native.outputs.key }}
          lookup-only: true
          enableCrossOsArchive: true

  native:
    name: iOS native app
    needs: fingerprint
    if: needs.fingerprint.outputs.saved != 'true'
    # One build per PR or branch. A new PR push cancels the stale build so it frees a scarce macOS
    # runner; a release build waits instead of being cancelled.
    concurrency:
      group: release-mobile-ios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ vars.T3CODE_IOS_RUNNER || vars.T3CODE_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    env:
      T3CODE_MOBILE_VERSION: ${{ needs.fingerprint.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...
          # Restoring the cached store took ~5 minutes on hosted macOS; installing takes under one.
          pnpm-store-cache: "false"

      - name: Resolve Xcode cache identity
        id: xcode
        run: |
          xcodebuild -version
          build=$(xcodebuild -version | awk '/Build version/ {print $3}')
          [ -n "$build" ] || { echo "::error::Cannot identify the Xcode build"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Cache native dependency downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
            ~/.cocoapods/repos
          key: ios-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
          restore-keys: |
            ios-downloads-v1-${{ runner.os }}-${{ runner.arch }}-

      # Keyed by dependency inputs, not commit: a per-commit 1.6 GB entry filled the 10 GB repository
      # cache and evicted itself, and a cold build takes ~80 min against ~13 warm. The store is
      # content-addressed, so an older lockfile's entry is safe to restore and still covers
      # every unchanged dependency.
      - name: Cache native compilation
        id: ios_cas
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ios-compilation-cache
          key: ios-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
          restore-keys: |
            ios-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      # Restoring across lockfiles keeps stale objects; start over before the saved entry crowds
      # out the repository's other caches. An exact hit is never saved again, so it stays. A cold
      # build unpacks to ~4.2 GB (1.6 GB compressed), so the limit sits well above that.
      - name: Bound the compilation cache
        if: steps.ios_cas.outputs.cache-hit != 'true'
        run: |
          cas="$GITHUB_WORKSPACE/.ios-compilation-cache"
          [ -d "$cas" ] || exit 0
          size_mb=$(du -sm "$cas" | cut -f1)
          echo "compilation cache: ${size_mb} MB"
          if [ "$size_mb" -gt 8192 ]; then
            echo "::notice::compilation cache is ${size_mb} MB; starting a fresh one"
            rm -rf "$cas"
          fi

      - name: Generate the iOS project
        run: |
          vp exec expo prebuild --clean --platform ios --no-install
          (cd ios && pod install)

      - name: Build the unsigned app
        run: |
          set -o pipefail
          workspace=$(ls -d ios/*.xcworkspace)
          scheme=$(basename "$workspace" .xcworkspace)
          /usr/bin/time -p xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            -hideShellScriptEnvironment -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$GITHUB_WORKSPACE/.ios-compilation-cache" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee "$RUNNER_TEMP/ios-build.log" | tail -100
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::xcodebuild produced no .app"; exit 1; }
          echo "APP_PATH=$PWD/$app" >> "$GITHUB_ENV"

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check the app runs on iOS 17
        run: ../../.github/scripts/check-ios17-libcxx-imports.sh "$APP_PATH"

      # Saved only after the iOS 17 check, so a reused native app has passed it.
      - name: Save the native app
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NATIVE_APP_PATH }}
          key: ${{ needs.fingerprint.outputs.key }}
          enableCrossOsArchive: true

  ipa:
    name: iOS unsigned IPA
    needs: [fingerprint, native]
    if: ${{ !cancelled() && needs.fingerprint.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      T3CODE_MOBILE_VERSION: ${{ needs.fingerprint.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...

      - name: Restore the native app
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NATIVE_APP_PATH }}
          key: ${{ needs.fingerprint.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Mirrors the app target's bundle phase (react-native-xcode.sh with expo export:embed and
      # hermesc), its Info.plist version, and expo-constants' app.config phase, at Xcode's paths.
      # Run on macOS this matched an xcodebuild app byte for byte; Linux hermesc lays out the same
      # bytecode differently. Updates are disabled, so expo-updates never reads app.manifest.
      - name: Refresh the JavaScript in the native app
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          products="$PWD/build/Build/Products/Release-iphoneos"
          app=$(find "$products" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::the saved native app is missing"; exit 1; }
          rm -rf "$app/assets" "$app/main.jsbundle"
          vp exec expo export:embed --entry-file "$PWD/index.ts" --platform ios --dev false --reset-cache \
            --bundle-output "$products/main.jsbundle" --assets-dest "$app" --minify false
          hermes=$(dirname "$(node -p "require.resolve('hermes-compiler/package.json', { paths: [require('path').dirname(require.resolve('react-native/package.json'))] })")")
          "$hermes/hermesc/linux64-bin/hermesc" -emit-binary -max-diagnostic-width=80 -O \
            -out "$app/main.jsbundle" "$products/main.jsbundle" 2> "$RUNNER_TEMP/hermesc.log" \
            || { cat "$RUNNER_TEMP/hermesc.log"; exit 1; }
          python3 - "$app/Info.plist" <<'EOF'
          import os, plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)
          version = os.environ["T3CODE_MOBILE_VERSION"]
          if info["CFBundleShortVersionString"] != version:
              info["CFBundleShortVersionString"] = version
              with open(path, "wb") as f:
                  plistlib.dump(info, f)
          EOF
          node node_modules/expo-constants/scripts/getAppConfig.js "$PWD" "$app/EXConstants.bundle" ios false production
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Package the IPA
        run: |
          set -euo pipefail
          read -r min_os short_version bundle_id < <(python3 - "$APP_PATH/Info.plist" <<'EOF'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          print(info["MinimumOSVersion"], info["CFBundleShortVersionString"], info["CFBundleIdentifier"])
          EOF
          )
          echo "bundle $bundle_id, version $short_version, minimum iOS $min_os"
          [ "$min_os" = "17.0" ] || { echo "::error::MinimumOSVersion is $min_os, expected 17.0"; exit 1; }
          [ "$short_version" = "$T3CODE_MOBILE_VERSION" ] \
            || { echo "::error::app version $short_version, expected $T3CODE_MOBILE_VERSION"; exit 1; }
          stage=$(mktemp -d)
          mkdir "$stage/Payload"
          cp -R "$APP_PATH" "$stage/Payload/"
          ipa="$GITHUB_WORKSPACE/T3-Code-$RELEASE_VERSION-ios-unsigned.ipa"
          (cd "$stage" && zip -qry "$ipa" Payload)
          unzip -l "$ipa" | grep -q 'Payload/[^/]*\.app/Info.plist' \
            || { echo "::error::$ipa has no Payload/*.app/Info.plist"; exit 1; }
          ls -lh "$ipa"

      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-unsigned
          path: ${{ github.workspace }}/T3-Code-*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
